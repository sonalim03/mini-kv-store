name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Format check
        run: |
          gofmt -l . | tee /tmp/fmt.out
          test ! -s /tmp/fmt.out

      - name: Vet (static analysis)
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests (race detector)
        run: go test -race -v ./...

      - name: Benchmarks
        run: go test -run=^$ -bench=. -benchtime=1x ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
