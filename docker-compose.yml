version: "3.9"
services:
  node1:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      NODE_ID: "node1"
      LISTEN_ADDR: ":9000"
      DATA_DIR: "/data"
      WAL_FSYNC_EVERY_WRITE: "true"
      PEERS: "node2@node2:9000,node3@node3:9000"
      REPLICATION_FACTOR: "2"
    ports: ["9001:9000"]
    volumes: ["node1-data:/data"]
    entrypoint: ["/usr/local/bin/server"]

  node2:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      NODE_ID: "node2"
      LISTEN_ADDR: ":9000"
      DATA_DIR: "/data"
      WAL_FSYNC_EVERY_WRITE: "true"
      PEERS: "node1@node1:9000,node3@node3:9000"
      REPLICATION_FACTOR: "2"
    ports: ["9002:9000"]
    volumes: ["node2-data:/data"]
    entrypoint: ["/usr/local/bin/server"]

  node3:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    environment:
      NODE_ID: "node3"
      LISTEN_ADDR: ":9000"
      DATA_DIR: "/data"
      WAL_FSYNC_EVERY_WRITE: "true"
      PEERS: "node1@node1:9000,node2@node2:9000"
      REPLICATION_FACTOR: "2"
    ports: ["9003:9000"]
    volumes: ["node3-data:/data"]
    entrypoint: ["/usr/local/bin/server"]

# This is now a REAL 3-node cluster: consistent hashing decides each key's
# owner, PEERS/NODE_ID wire up membership + heartbeats, and writes replicate
# to REPLICATION_FACTOR-1 other nodes. Verified manually (see README
# "Verified end-to-end") by inspecting WAL files across two nodes directly —
# not yet covered by an automated docker-based test, so treat "docker
# compose up" + a manual kv-cli SET/GET across ports as a smoke test, not a
# substitute for the tests/distributed suite that's still a TODO.

volumes:
  node1-data:
  node2-data:
  node3-data:
